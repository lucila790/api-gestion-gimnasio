<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gimnasio - Gestión de Planes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1"><i class="bi bi-dumbbell me-2"></i>Panel de Control - Gestión de Gimnasio</span>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="card-title mb-0" id="formTitle">Registrar Nuevo Plan</h5>
                    </div>
                    <div class="card-body">
                        <form id="planForm">
                            <input type="hidden" id="planId">
                            <div class="mb-3">
                                <label class="form-label">Nombre del Plan</label>
                                <input type="text" class="form-control" id="nombre" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Descripción</label>
                                <textarea class="form-control" id="descripcion" rows="2"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Precio ($)</label>
                                <input type="number" class="form-control" id="precio" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Duración (Meses)</label>
                                <input type="number" class="form-control" id="duracionMeses" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Sesiones Semanales</label>
                                <input type="number" class="form-control" id="numeroSesionesSemanales">
                            </div>
                            <button type="submit" class="btn btn-success w-100" id="btnGuardar">Guardar Plan</button>
                            <button type="button" class="btn btn-secondary w-100 mt-2 d-none" id="btnCancelar" onclick="resetForm()">Cancelar Edición</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card shadow-sm mb-3">
                    <div class="card-body d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <h5 class="mb-0">Planes de Entrenamiento</h5>
                        <div class="d-flex gap-2">
                            <input type="number" id="filtroPrecio" class="form-control form-control-sm" placeholder="Precio Máximo">
                            <button class="btn btn-outline-primary btn-sm" onclick="filtrarEconomicos()">Filtrar</button>
                            <button class="btn btn-outline-secondary btn-sm" onclick="listarPlanes()">Limpiar</button>
                        </div>
                    </div>
                </div>

                <div class="table-responsive bg-white rounded shadow-sm">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Precio</th>
                                <th>Duración</th>
                                <th>Sesiones</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="planesTableBody">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080/api/planes';

        document.addEventListener('DOMContentLoaded', listarPlanes);
        document.getElementById('planForm').addEventListener('submit', guardarPlan);

        async function listarPlanes() {
            try {
                const response = await fetch(API_URL);
                const planes = await response.json();
                renderTable(planes);
            } catch (error) {
                alert('Error al conectar con la API de Gimnasio');
            }
        }

        async function filtrarEconomicos() {
            const precio = document.getElementById('filtroPrecio').value;
            if(!precio) return;
            try {
                const response = await fetch(`${API_URL}/filtrar?precioMax=${precio}`);
                const planes = await response.json();
                renderTable(planes);
            } catch (error) {
                console.error(error);
            }
        }

        function renderTable(planes) {
            const tbody = document.getElementById('planesTableBody');
            tbody.innerHTML = '';
            planes.forEach(p => {
                tbody.innerHTML += `
                    <tr>
                        <td><strong>#${p.id}</strong></td>
                        <td>
                            <span class="fw-bold">${p.nombre}</span><br>
                            <small class="text-muted">${p.descripcion || 'Sin descripción'}</small>
                        </td>
                        <td class="text-success fw-bold">$${p.precio}</td>
                        <td>${p.duracionMeses} Mes/es</td>
                        <td>${p.numeroSesionesSemanales || 'No especifica'}</td>
                        <td class="text-center">
                            <button class="btn btn-sm btn-warning me-1" onclick="cargarEditar(${JSON.stringify(p).replace(/"/g, '&quot;')})"><i class="bi bi-pencil"></i></button>
                            <button class="btn btn-sm btn-danger" onclick="eliminarPlan(${p.id})"><i class="bi bi-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        async function guardarPlan(e) {
            e.preventDefault();
            const id = document.getElementById('planId').value;
            const data = {
                nombre: document.getElementById('nombre').value,
                descripcion: document.getElementById('descripcion').value,
                precio: parseFloat(document.getElementById('precio').value),
                duracionMeses: parseInt(document.getElementById('duracionMeses').value),
                numeroSesionesSemanales: parseInt(document.getElementById('numeroSesionesSemanales').value) || null
            };

            const url = id ? `${API_URL}/${id}` : API_URL;
            const method = id ? 'PUT' : 'POST';

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (response.ok) {
                    resetForm();
                    listarPlanes();
                } else {
                    alert('Error en las validaciones de los campos.');
                }
            } catch (error) {
                alert('Error al guardar el plan.');
            }
        }

        function cargarEditar(plan) {
            document.getElementById('planId').value = plan.id;
            document.getElementById('nombre').value = plan.nombre;
            document.getElementById('descripcion').value = plan.descripcion;
            document.getElementById('precio').value = plan.precio;
            document.getElementById('duracionMeses').value = plan.duracionMeses;
            document.getElementById('numeroSesionesSemanales').value = plan.numeroSesionesSemanales || '';
            
            document.getElementById('formTitle').innerText = 'Modificar Plan';
            document.getElementById('btnCancelar').classList.remove('d-none');
        }

        function resetForm() {
            document.getElementById('planForm').reset();
            document.getElementById('planId').value = '';
            document.getElementById('formTitle').innerText = 'Registrar Nuevo Plan';
            document.getElementById('btnCancelar').classList.add('d-none');
        }

        async function eliminarPlan(id) {
            if (!confirm('¿Seguro que querés eliminar este plan de entrenamiento?')) return;
            try {
                await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                listarPlanes();
            } catch (error) {
                alert('No se pudo eliminar el plan.');
            }
        }
    </script>
</body>
</html>
